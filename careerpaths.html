<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillHub - Career Paths</title>

<style>

:root{
    --blue:#1769e0;
    --dark-blue:#0b3d91;
    --light-blue:#eaf3ff;
    --cyan:#06b6d4;
    --purple:#7c3aed;
    --green:#10b981;
    --orange:#f59e0b;
    --red:#ef4444;
    --dark:#172033;
    --gray:#64748b;
    --light:#f5f9ff;
    --white:#ffffff;
    --border:#dce8f7;
    --shadow:0 10px 30px rgba(23,105,224,.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--light);
    color:var(--dark);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}


/* ================= NAVBAR ================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:linear-gradient(135deg,#0b3d91,#1769e0);
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.nav-inner{
    width:min(1200px,92%);
    margin:auto;
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    font-size:23px;
    font-weight:800;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:white;
    color:var(--blue);
    display:grid;
    place-items:center;
    font-size:24px;
    font-weight:900;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:5px;
    list-style:none;
}

.nav-links a{
    color:white;
    padding:10px 12px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
    background:rgba(255,255,255,.18);
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}


/* ================= HERO ================= */

.hero{
    padding:72px 0 65px;
    background:
        radial-gradient(circle at 15% 20%,rgba(23,105,224,.13),transparent 28%),
        radial-gradient(circle at 85% 30%,rgba(124,58,237,.12),transparent 25%),
        linear-gradient(135deg,#eef6ff,#ffffff);
}

.hero-content{
    text-align:center;
    max-width:850px;
    margin:auto;
}

.badge{
    display:inline-block;
    background:#e7f0ff;
    color:var(--blue);
    padding:7px 14px;
    border-radius:30px;
    font-size:12px;
    font-weight:800;
    margin-bottom:18px;
}

.hero h1{
    font-size:46px;
    line-height:1.15;
    margin-bottom:15px;
}

.hero h1 span{
    color:var(--blue);
}

.hero p{
    color:var(--gray);
    max-width:720px;
    margin:auto;
    font-size:17px;
}


/* ================= SEARCH ================= */

.search-section{
    margin-top:-28px;
    position:relative;
    z-index:5;
}

.search-box{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:16px;
    display:flex;
    gap:12px;
}

.search-box input{
    flex:1;
    border:1px solid var(--border);
    outline:none;
    border-radius:11px;
    padding:14px 16px;
    font-size:14px;
}

.search-box input:focus{
    border-color:var(--blue);
}

.search-box button{
    border:0;
    background:var(--blue);
    color:white;
    border-radius:11px;
    padding:0 25px;
    font-weight:800;
    cursor:pointer;
}

.search-box button:hover{
    background:var(--dark-blue);
}
