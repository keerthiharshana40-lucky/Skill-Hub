<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillHub - Projects</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --blue: #1769e0;
    --dark-blue: #0b3d91;
    --light-blue: #eaf3ff;
    --cyan: #06b6d4;
    --purple: #7c3aed;
    --green: #10b981;
    --orange: #f59e0b;
    --red: #ef4444;
    --dark: #172033;
    --gray: #64748b;
    --light: #f5f9ff;
    --white: #ffffff;
    --border: #dce8f7;
    --shadow: 0 10px 30px rgba(23, 105, 224, 0.10);
}

body {
    background: var(--light);
    color: var(--dark);
}


/* ================= NAVBAR ================= */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: linear-gradient(
        135deg,
        var(--dark-blue),
        var(--blue)
    );

    padding: 15px 6%;

    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.nav-container {
    max-width: 1200px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    color: white;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;
}

.logo-box {
    width: 42px;
    height: 42px;

    background: white;
    color: var(--blue);

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: bold;
}

.nav-links {
    list-style: none;

    display: flex;
    align-items: center;

    gap: 25px;
}

.nav-links a {
    color: white;

    text-decoration: none;

    font-size: 14px;
    font-weight: 600;

    transition: 0.3s;
}

.nav-links a:hover {
    opacity: 0.75;
}

.active-link {
    border-bottom: 2px solid white;
    padding-bottom: 4px;
}

.profile-btn {
    background: white;
    color: var(--blue) !important;

    padding: 10px 16px;

    border-radius: 20px;
}

.menu-btn {
    display: none;

    color: white;

    font-size: 28px;

    cursor: pointer;
}


/* ================= HERO ================= */

.hero {
    padding: 70px 6%;

    background:
        linear-gradient(
            135deg,
            #eaf3ff,
            #ffffff
        );

    text-align: center;
}

.hero-container {
    max-width: 900px;
    margin: auto;
}

.hero-icon {
    width: 80px;
    height: 80px;

    margin: auto;
    margin-bottom: 20px;

    background: white;
    color: var(--blue);

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;

    box-shadow: var(--shadow);
}

.hero h1 {
    font-size: 45px;

    margin-bottom: 15px;
}

.hero h1 span {
    color: var(--blue);
}

.hero p {
    max-width: 750px;

    margin: auto;

    color: var(--gray);

    font-size: 17px;

    line-height: 1.7;
}


/* ================= SEARCH ================= */

.search-section {
    padding: 45px 6%;

    background: white;
}

.search-container {
    max-width: 850px;

    margin: auto;
}

.search-box {
    display: flex;

    border: 2px solid var(--border);

    border-radius: 15px;

    overflow: hidden;

    box-shadow: var(--shadow);
}

.search-box input {
    flex: 1;

    border: none;
    outline: none;

    padding: 17px;

    font-size: 16px;
}

.search-box button {
    border: none;

    background: var(--blue);

    color: white;

    padding: 0 28px;

    cursor: pointer;

    font-weight: bold;
}


/* ================= FILTERS ================= */

.filters {
    padding: 25px 6%;

    background: white;

    border-top: 1px solid var(--border);
}

.filter-container {
    max-width: 1200px;

    margin: auto;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;
}

.filter-btn {
    border: 1px solid var(--border);

    background: var(--light);

    color: var(--dark);

    padding: 10px 18px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: 600;

    transition: 0.3s;
}

.filter-btn:hover,
.filter-btn.active {
    background: var(--blue);

    color: white;

    border-color: var(--blue);
}


/* ================= SECTION ================= */

.section {
    padding: 65px 6%;
}

.section-container {
    max-width: 1200px;

    margin: auto;
}

.section-title {
    text-align: center;

    margin-bottom: 40px;
}

.section-title h2 {
    font-size: 32px;

    margin-bottom: 10px;
}

.section-title p {
    color: var(--gray);
}


/* ================= PROJECT GRID ================= */

.project-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;
}

.project-card {
    background: white;

    border: 1px solid var(--border);

    border-radius: 20px;

    overflow: hidden;

    box-shadow: var(--shadow);

    transition: 0.3s;
}

.project-card:hover {
    transform: translateY(-7px);
}


/* PROJECT TOP */

.project-top {
    height: 145px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 55px;
}

.web {
    background: #eaf3ff;
}

.python {
    background: #f1eaff;
}

.data {
    background: #e7faf3;
}

.ai {
    background: #fff5df;
}

.security {
    background: #e4fbff;
}

.design {
    background: #ffebeb;
}


/* PROJECT CONTENT */

.project-content {
    padding: 23px;
}

.project-category {
    display: inline-block;

    background: var(--light-blue);

    color: var(--blue);

    padding: 5px 10px;

    border-radius: 15px;

    font-size: 11px;

    font-weight: bold;

    margin-bottom: 12px;
}

.project-content h3 {
    font-size: 20px;

    margin-bottom: 9px;
}

.project-content p {
    color: var(--gray);

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 16px;
}


/* TAGS */

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 18px;
}

.tag {
    background: #f1f5f9;

    color: var(--gray);

    padding: 5px 9px;

    border-radius: 8px;

    font-size: 11px;
}


/* PROJECT INFO */

.project-info {
    display: flex;

    justify-content: space-between;

    padding-top: 15px;

    border-top: 1px solid var(--border);

    color: var(--gray);

    font-size: 12px;
}


/* PROJECT BUTTON */

.project-btn {
    display: block;

    margin-top: 18px;

    text-align: center;

    text-decoration: none;

    background: var(--light-blue);

    color: var(--blue);

    padding: 11px;

    border-radius: 10px;

    font-weight: bold;

    transition: 0.3s;
}

.project-btn:hover {
    background: var(--blue);

    color: white;
}


/* ================= MY PROJECTS ================= */

.my-projects {
    background: white;
}

.my-project-card {
    max-width: 950px;

    margin: auto;

    background: var(--light);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 28px;

    box-shadow: var(--shadow);
}

.my-project-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.my-project-header h3 {
    font-size: 23px;
}

.status {
    background: #e7faf3;

    color: var(--green);

    padding: 8px 14px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;
}

.project-progress {
    margin-bottom: 25px;
}

.progress-title {
    display: flex;

    justify-content: space-between;

    margin-bottom: 8px;

    font-size: 13px;

    font-weight: bold;
}

.progress-bar {
    height: 10px;

    width: 100%;

    background: #e5edf7;

    border-radius: 20px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--cyan)
        );

    border-radius: 20px;
}


/* PROJECT STEPS */

.project-steps {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.project-step {
    text-align: center;

    background: white;

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 15px;
}

.project-step-icon {
    font-size: 25px;

    margin-bottom: 7px;
}

.project-step h4 {
    font-size: 13px;

    margin-bottom: 4px;
}

.project-step p {
    color: var(--gray);

    font-size: 11px;
}


/* ================= PROJECT BENEFITS ================= */

.benefits {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.benefit {
    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 25px;

    text-align: center;

    box-shadow: var(--shadow);
}

    font-
